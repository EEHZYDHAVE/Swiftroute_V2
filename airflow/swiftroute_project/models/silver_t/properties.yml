version: 2

models:
  - name: onfleet_deliveries_t
    description: >-
      Silver Technical representation of Onfleet tasks. Contains one row per unique
      source task, with standardized timestamps, flattened task attributes, and a
      persistent readable surrogate task identifier.
    columns:
      - name: task_id
        description: >-
          Persistent readable surrogate identifier used for downstream joins, in the
          format task_id_1, task_id_2, and so on.
        data_tests:
          - unique
          - not_null

      - name: source_task_id
        description: Original Onfleet task identifier retained for source reconciliation and incremental matching.
        data_tests:
          - unique
          - not_null

      - name: source_updated_at_utc
        description: >-
          Source last-modified timestamp converted from Unix epoch milliseconds to a
          UTC timestamp. Used as the incremental processing watermark.
        data_tests:
          - not_null

      - name: task_state
        description: Numeric Onfleet task state code; descriptions are intentionally deferred to Silver Business.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false

      - name: worker_id
        description: >-
          Source worker reference. The text sentinel N/A is used when the original
          worker reference is missing; worker_reference_missing preserves that fact.
        data_tests:
          - not_null

  - name: onfleet_workers_t
    description: >-
      Silver Technical representation of Onfleet workers. Contains one row per unique
      source worker, with flattened vehicle and employment metadata fields.
    columns:
      - name: worker_id
        description: Original Onfleet worker identifier retained as the worker key.
        data_tests:
          - unique
          - not_null

  - name: linnworks_stock_items_t
    description: "Silver Technical stock-item records, one row per source StockItemId. SKU normalization is for comparison only and does not merge different source records."
    columns:
      - name: stock_item_id
        description: "Persistent readable surrogate identifier used by downstream models."
        data_tests:
          - unique
          - not_null
      - name: source_stock_item_id
        description: "Original Linnworks StockItemId retained for traceability and incremental merge matching."
        data_tests:
          - unique
          - not_null

  - name: linnworks_orders_t
    description: "Silver Technical processed orders, one row per source pkOrderID. The Items array remains nested to preserve order grain."
    columns:
      - name: order_id
        description: "Persistent readable surrogate identifier used by downstream models."
        data_tests:
          - unique
          - not_null
      - name: source_order_id
        description: "Original Linnworks pkOrderID retained for traceability and incremental merge matching."
        data_tests:
          - unique
          - not_null
      - name: customer_profile_conflict
        description: "True when multiple distinct customer/address profiles tie for the highest frequency among duplicate source order records."

  - name: linnworks_stock_transaction_t
    description: "Silver Technical stock transaction records, one row per source pkStockTransactionId. Negative quantities are preserved as valid inventory movements."
    columns:
      - name: stock_transaction_id
        description: "Persistent readable surrogate identifier used by downstream models."
        data_tests:
          - unique
          - not_null
      - name: source_stock_transaction_id
        description: "Original Linnworks pkStockTransactionId retained for traceability and incremental merge matching."
        data_tests:
          - unique
          - not_null
      - name: is_deleted_order_reference
        description: "True when the original order reference used the DELETED-ORD- prefix."
    
  - name: salesforce_accounts_t
    description: >
      Silver Technical customer master with one row per Salesforce Account.
      Uses a readable account_id, preserves the Salesforce source_account_id,
      and standardizes client_id for joins across SwiftRoute source systems.
      Billing address and owner details are flattened.
    columns:
      - name: account_id
        description: Readable Silver surrogate identifier for the account.
        data_tests:
          - unique
          - not_null
      - name: source_account_id
        description: Original Salesforce Account.Id retained for traceability.
        data_tests:
          - unique
          - not_null
      - name: account_name
        description: Customer organization's display name.
        data_tests:
          - not_null
      - name: client_id
        description: Shared SwiftRoute client identifier for cross-system joins.
        data_tests:
          - not_null
      - name: source_updated_at_utc
        description: Salesforce LastModifiedDate converted to a UTC timestamp.
        data_tests:
          - not_null

  - name: salesforce_contracts_t
    description: >
      Silver Technical contracts, retaining orphaned contracts while flagging
      records without a linked account. Uses readable Silver identifiers and
      the shared SwiftRoute client_id.
    columns:
      - name: contract_id
        description: Readable Silver surrogate identifier for the contract.
        data_tests:
          - unique
          - not_null
      - name: source_contract_id
        description: Original Salesforce Contract.Id retained for traceability.
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: >
          Readable Silver Account identifier. Null for contracts without a
          source AccountId; relationship tests ignore null child values.
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_salesforce_accounts')
                field: account_id
      - name: client_id
        description: Shared SwiftRoute client ID inherited from the linked account.
        data_tests:
          - not_null
      - name: is_orphaned_contract
        description: True when the source contract has no AccountId.
        data_tests:
          - not_null
      - name: account_reference_unmatched
        description: True when a supplied AccountId cannot be mapped to a Silver Account.
        data_tests:
          - not_null
      - name: source_updated_at_utc
        description: Salesforce LastModifiedDate converted to a UTC timestamp.
        data_tests:
          - not_null

  - name: salesforce_contract_rates_t
    description: >
      Silver Technical contract rate records, preserving individual service
      rates, optional zone details, and effective dates. Rates link to their
      related contract and account.
    columns:
      - name: contract_rate_id
        description: Readable Silver surrogate identifier for the rate record.
        data_tests:
          - unique
          - not_null
      - name: source_contract_rate_id
        description: Original Contract_Rate__c Id retained for traceability.
        data_tests:
          - unique
          - not_null
      - name: contract_id
        description: Readable Silver Contract identifier mapped from Contract__c.
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_salesforce_contracts')
                field: contract_id
      - name: account_id
        description: Readable Silver Account identifier mapped from Account__c.
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_salesforce_accounts')
                field: account_id
      - name: client_id
        description: Shared SwiftRoute client identifier used across source systems.
        data_tests:
          - not_null
      - name: contract_reference_unmatched
        description: True when the supplied contract reference has no matching Silver Contract.
        data_tests:
          - not_null
      - name: account_reference_unmatched
        description: True when the supplied account reference has no matching Silver Account.
        data_tests:
          - not_null
      - name: client_id_mismatch
        description: True when the source rate client ID differs from the linked contract/account client ID.
        data_tests:
          - not_null
      - name: contract_account_mismatch
        description: True when the rate's source account differs from the linked contract's source account.
        data_tests:
          - not_null
      - name: effective_date
        description: Date on which the rate becomes effective.
        data_tests:
          - not_null
      - name: created_at_utc
        description: Salesforce CreatedDate converted to a UTC timestamp.
        data_tests:
          - not_null

  - name: salesforce_opportunities_t
    description: >
      Silver Technical opportunity records. Duplicate source Opportunity IDs
      are retained and flagged as a known simulation defect. Each source row
      receives a generated readable opportunity_id.
    columns:
      - name: opportunity_id
        description: Generated readable identifier unique within the rebuilt snapshot.
        data_tests:
          - unique
          - not_null
      - name: source_opportunity_id
        description: Original Salesforce Opportunity.Id; duplicates are a known source defect.
        data_tests:
          - not_null
      - name: account_id
        description: Readable Silver Account identifier mapped from AccountId.
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_salesforce_accounts')
                field: account_id
      - name: client_id
        description: Shared SwiftRoute client identifier inherited from the linked account.
        data_tests:
          - not_null
      - name: source_opportunity_id_is_duplicated
        description: Flags source Opportunity IDs occurring more than once in the source snapshot.
        data_tests:
          - not_null
      - name: account_reference_unmatched
        description: True when the supplied AccountId cannot be mapped to a Silver Account.
        data_tests:
          - not_null

  - name: quickbooks_expenses_t
    description: >
      Silver Technical QuickBooks Purchase records, one row per retained
      source expense. Source IDs may be duplicated in the simulation,
      so expense_id is a generated technical identifier.
    columns:
      - name: expense_id
        description: Generated technical identifier for each retained expense record.
        data_tests:
          - unique
          - not_null
      - name: has_duplicate_source_expense_id
        description: Flags records whose non-null source expense ID occurs more than once.
        data_tests:
          - not_null
      - name: processed_at_utc
        description: Timestamp when the Silver model processed the record.
        data_tests:
          - not_null

  - name: quickbooks_invoices_t
    description: >
      Silver Technical QuickBooks invoices, one row per source invoice.
      Invoice lines and linked transactions remain nested at invoice grain.
    columns:
      - name: invoice_id
        description: Original QuickBooks invoice ID, confirmed unique in the source dataset.
        data_tests:
          - unique
          - not_null
      - name: transaction_date
        description: Date the invoice was issued or recorded in QuickBooks.
        data_tests:
          - not_null
      - name: processed_at_utc
        description: Timestamp when the Silver model processed the record.
        data_tests:
          - not_null

  - name: quickbooks_payments_t
    description: >
      Silver Technical QuickBooks payments, one row per source payment.
      Payment allocations and linked transaction references remain nested.
    columns:
      - name: payment_id
        description: Original QuickBooks payment ID, confirmed unique in the source dataset.
        data_tests:
          - unique
          - not_null
      - name: transaction_date
        description: Date the payment was recorded in QuickBooks.
        data_tests:
          - not_null
      - name: processed_at_utc
        description: Timestamp when the Silver model processed the record.
        data_tests:
          - not_null

  - name: samsara_driver_summary_t
    description: >
      Silver Technical Samsara driver summaries, one row per source driver ID.
      HOS violations remain nested and are exposed through count and presence fields.
    columns:
      - name: driver_id
        description: Original Samsara driver identifier, retained as a string for cross-table joins.
        data_tests:
          - unique
          - not_null
      - name: driver_name
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null
      - name: hos_violations
        description: Nested HOS violation details supplied by Samsara.
        data_tests:
          - not_null
      - name: hos_violation_count
        data_tests:
          - not_null
      - name: has_hos_violations
        data_tests:
          - not_null
      - name: processed_at_utc
        data_tests:
          - not_null

  - name: samsara_trips_t
    description: >
      Silver Technical Samsara trips, one row per source trip ID. Driverless trips are kept
      with driver_id N/A and driver_assignment_status unassigned. Fuel is standardized to US gallons.
    columns:
      - name: trip_id
        description: Original Samsara trip identifier; no surrogate key is created.
        data_tests:
          - unique
          - not_null
      - name: vehicle_id
        data_tests:
          - not_null
      - name: driver_id
        description: Original driver ID or N/A when no driver was logged in.
        data_tests:
          - not_null
      - name: driver_assignment_status
        data_tests:
          - not_null
      - name: trip_start_at_utc
        data_tests:
          - not_null
      - name: fuel_consumed_gallons
        description: Fuel consumed in US gallons, using the source gallons value or converting milliliters.
        data_tests:
          - not_null
      - name: safety_events
        description: Nested Samsara safety event records; retained at trip grain.
        data_tests:
          - not_null
      - name: safety_event_count
        data_tests:
          - not_null
      - name: processed_at_utc
        data_tests:
          - not_null

  - name: samsara_vehicles_t
    description: >
      Silver Technical Samsara vehicle roster, one row per source vehicle ID. Samsara vehicle IDs
      are not inferred to match Onfleet delivery records.
    columns:
      - name: vehicle_id
        description: Original Samsara vehicle identifier, retained as a string.
        data_tests:
          - unique
          - not_null
      - name: vehicle_name
        data_tests:
          - not_null
      - name: vehicle_type
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null
      - name: tags
        description: Readable nested array of source tag IDs and names.
        data_tests:
          - not_null
      - name: operational_status
        data_tests:
          - not_null
      - name: processed_at_utc
        data_tests:
          - not_null
  
  - name: gusto_employees_t
    description: >
      Silver Technical Gusto employee records, one row per Gusto employee UUID.
      The Onfleet Worker ID custom field is extracted as onfleet_worker_id for cross-system mapping.
    columns:
      - name: employee_uuid
        description: Gusto employee UUID and row-level primary key.
        data_tests:
          - unique
          - not_null
      - name: onfleet_worker_id
        description: Onfleet Worker ID extracted from the Gusto employee custom-fields array; N/A when absent.
        data_tests:
          - not_null
      - name: processed_at_utc
        description: Timestamp when the Silver model processed the record.
        data_tests:
          - not_null

  - name: gusto_payroll_compensations_t
    description: >
      Silver Technical payroll employee compensation records, one row per employee compensation
      within a payroll run. Payroll-run context and totals are joined from the separate Bronze
      gusto_payroll_runs relation. payroll_compensation_id is a stable generated technical row key.
      Payroll-level totals repeat across employee rows and must not be summed at this grain.
    columns:
      - name: payroll_compensation_id
        description: Generated surrogate key from payroll-run UUID and compensation ordinal.
        data_tests:
          - unique
          - not_null
      - name: source_payroll_id
        description: Original Gusto payroll-run UUID; repeated across compensation rows belonging to the same run.
        data_tests:
          - not_null
      - name: employee_uuid
        description: Gusto employee UUID associated with this payroll compensation row; N/A if absent in the source.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_gusto_employees')
                field: employee_uuid
              config:
                where: "employee_uuid != 'N/A'"
      - name: processed_at_utc
        description: Timestamp when the Silver model processed the record.
        data_tests:
          - not_null